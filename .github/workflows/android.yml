name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable APK signing key
        env:
          HRUSKA_KEYSTORE_BASE64: ${{ secrets.HRUSKA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HRUSKA_KEYSTORE_BASE64" ]; then
            echo "::error::Missing HRUSKA_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$HRUSKA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hruska-upload.jks"
      - name: Build debug APK
        env:
          HRUSKA_SIGNING_STORE: ${{ runner.temp }}/hruska-upload.jks
        run: |
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Hruska-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
